version: 2

updates:
  - package-ecosystem: "npm"
    directory: "/memories"
    schedule:
      interval: "weekly"
    target-branch: "main"
    labels:
      - "npm dependencies"
      - "frontend"

  - package-ecosystem: "npm"
    directory: "/api"
    schedule:
      interval: "weekly"
    target-branch: "main"
    labels:
      - "npm dependencies"
      - "backend"
